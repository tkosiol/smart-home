# Home Assistant on the gateway (docs/superpowers/specs/2026-11-19-home-assistant-adapter-design.md, section 7).
# The integration smart_bridge is set up in the UI with a pairing code; it has no YAML configuration.
# Deliberately without default_config: only what the UI and discovery need (the Pi has 1 GB).
http:
frontend:
config:
person:
network:
ssdp:
zeroconf:
dhcp:
logger:
  default: warning
recorder:
  # The platform keeps the history; one day here spares the SD card.
  purge_keep_days: 1
  commit_interval: 60
