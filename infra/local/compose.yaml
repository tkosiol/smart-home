name: smart-local

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    environment:
      POSTGRES_USER: smart
      POSTGRES_DB: smart
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-smart-local-only}
      TZ: UTC
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart -d smart']
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    image: eclipse-mosquitto:2.1.2-alpine
    entrypoint: ['/bin/sh', '/smart/entrypoint.sh']
    environment:
      # The ACL grants the backend's rights to this exact name; MQTT_TLS stays off locally (the default).
      MQTT_USER: smart-api
      MQTT_PASSWORD: ${LOCAL_MQTT_PASSWORD:-smart-dev-only}
      # The simulator below connects as smart-simulator, restricted to its own gateway ID.
      MQTT_SIMULATOR_PASSWORD: ${LOCAL_SIMULATOR_PASSWORD:-smart-simulator-dev-only}
      MQTT_SIMULATOR_GATEWAY_ID: ${LOCAL_SIMULATOR_GATEWAY_ID:-gw-sim00001}
    ports:
      - '127.0.0.1:1884:1883'
    volumes:
      - ../broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../broker/tls.conf:/mosquitto/config/tls.conf:ro
      - ../broker/acl:/mosquitto/config/acl:ro
      - ../broker/entrypoint.sh:/smart/entrypoint.sh:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -u "$$MQTT_USER" -P "$$MQTT_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 5s
      timeout: 5s
      retries: 20

  # A gateway like the Raspberry Pi's, with six soil sensors and a lamp, for the backend and the app to talk to.
  # It reports every 300 seconds; for quick feedback while developing start the stack with
  #   LOCAL_SIMULATOR_INTERVAL_SECONDS=10 pnpm infra:up
  # (a fixed course of the values: LOCAL_SIMULATOR_SEED=1). The image is built from this repository.
  simulator:
    build:
      context: ../..
      dockerfile: apps/gateway-simulator/Dockerfile
    image: smart-local-simulator
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://broker:1883
      MQTT_USERNAME: smart-simulator
      MQTT_PASSWORD: ${LOCAL_SIMULATOR_PASSWORD:-smart-simulator-dev-only}
      GATEWAY_ID: ${LOCAL_SIMULATOR_GATEWAY_ID:-gw-sim00001}
      INTERVAL_SECONDS: ${LOCAL_SIMULATOR_INTERVAL_SECONDS:-300}
      SEED: ${LOCAL_SIMULATOR_SEED:-}
    depends_on:
      broker:
        condition: service_healthy

  mail:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  broker-data:
