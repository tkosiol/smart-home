name: ${STACK_NAME:?STACK_NAME is required}

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  web:
    <<: *defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/tkosiol}/smart-home-web:${IMAGE_TAG:?IMAGE_TAG is required}
    read_only: true
    tmpfs: [/tmp]
    environment:
      SMART_INSTANCE_APPEARANCE: ${SMART_INSTANCE_APPEARANCE:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal: {}
      proxy:
        aliases: ['${STACK_NAME}-web']

  api:
    <<: *defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/tkosiol}/smart-home-api:${IMAGE_TAG:?IMAGE_TAG is required}
    read_only: true
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: UTC
      DATABASE_URL: postgres://smart:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/smart
      MQTT_URL: mqtt://broker:1883
      MQTT_USERNAME: smart-api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?MQTT_API_PASSWORD is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      # Proxies in front of the api whose X-Forwarded-For entries are trusted: web nginx (1); on the
      # VPS Nginx Proxy Manager sits in front as well (2).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Mail for the sign-in codes; without SMTP_URL the e-mail sign-in is off. MAIL_ALLOWLIST (staging)
      # limits who may receive mail.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
      # Trust anchor and CRL expiry of the gateway certificates (copied by infra/deploy/broker-certs.sh).
      GATEWAY_CA_FILE: /smart/certs/ca.crt
      GATEWAY_CRL_NEXT_UPDATE_FILE: /smart/certs/crl-next-update
    volumes:
      # Public files only (CA, CRL expiry): the api must never see the broker's server key.
      - ./certs/public:/smart/certs:ro
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      internal:
        # web reaches the api only through this distinctive name; the generic service name "api"
        # could also be answered by a foreign container on the shared proxy network.
        aliases: [smart-api-upstream]

  db:
    <<: *defaults
    image: timescale/timescaledb:2.30.2-pg17
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    shm_size: 256mb
    environment:
      POSTGRES_USER: smart
      POSTGRES_DB: smart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart -d smart']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  broker:
    <<: *defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/tkosiol}/smart-home-broker:${IMAGE_TAG:?IMAGE_TAG is required}
    read_only: true
    # /mosquitto/run holds the rendered configuration, ACL, password file and certificate copies.
    tmpfs: [/tmp, /mosquitto/run]
    environment:
      MQTT_USER: smart-api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?MQTT_API_PASSWORD is required}
      # off until infra/deploy/broker-certs.sh has copied the certificates and switched it on; the
      # entrypoint aborts when it is on and a file is missing, and on any value other than on or off.
      MQTT_TLS: ${MQTT_TLS:-off}
      # Optional simulator user for one gateway ID (gw-xxxxxxxx); empty = no simulator.
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
      MQTT_SIMULATOR_GATEWAY_ID: ${MQTT_SIMULATOR_GATEWAY_ID:-}
      TZ: UTC
    volumes:
      - broker-data:/mosquitto/data
      - ./certs/public:/mosquitto/certs:ro
      # The server key lives apart from the files the api can read.
      - ./certs/private:/mosquitto/certs-private:ro
    # Gateways connect here with a client certificate. Production publishes 8883 to the internet
    # (MQTT_PUBLIC_PORT=8883); everywhere else it stays on localhost.
    ports:
      - '${MQTT_PUBLIC_PORT:-127.0.0.1:18883}:8883'
    networks: [internal]

  # Staging only (profile `simulator`, set by provision.sh): behaves like the Raspberry Pi's gateway with six
  # soil sensors and a lamp. It connects as the broker's smart-simulator user, which may only use its own
  # gateway prefix. The variables stay optional because compose reads them even while the profile is off.
  simulator:
    <<: *defaults
    profiles: [simulator]
    image: ${IMAGE_REGISTRY:-ghcr.io/tkosiol}/smart-home-simulator:${IMAGE_TAG:?IMAGE_TAG is required}
    # The image runs as the unprivileged node user.
    read_only: true
    tmpfs: [/tmp]
    environment:
      TZ: UTC
      MQTT_URL: mqtt://broker:1883
      MQTT_USERNAME: smart-simulator
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
      GATEWAY_ID: ${MQTT_SIMULATOR_GATEWAY_ID:-}
      INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-300}
      SEED: ${SIMULATOR_SEED:-}
    depends_on:
      broker:
        condition: service_healthy
    networks: [internal]

  backup:
    <<: *defaults
    profiles: [backup]
    image: ${IMAGE_REGISTRY:-ghcr.io/tkosiol}/smart-home-backup:${IMAGE_TAG:?IMAGE_TAG is required}
    # Runs as the owner of the stack directory (mode 700, .env 600) so the config backup can read it.
    user: '${BACKUP_UID:-10001}:${BACKUP_GID:-10001}'
    read_only: true
    tmpfs: [/tmp]
    environment:
      PGHOST: db
      PGUSER: smart
      PGDATABASE: smart
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RESTIC_REPOSITORY: s3:https://${B2_ENDPOINT:-}/${B2_BUCKET:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${B2_APP_KEY:-}
      BACKUP_HOST_TAG: ${STACK_NAME}
      HC_BACKUP_URL: ${HC_BACKUP_URL:-}
      HC_RESTORE_URL: ${HC_RESTORE_URL:-}
    volumes:
      - ./:/stack-config:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}

volumes:
  db-data: {}
  broker-data: {}
