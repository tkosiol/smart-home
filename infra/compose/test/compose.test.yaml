services:
  web:
    ports:
      - '127.0.0.1:18080:8080'
    environment:
      SMART_INSTANCE_APPEARANCE_EDITOR: 'true'
      # Must match STACK_TEST_INSTANCE in tests/e2e/specs/stack-smoke.spec.ts.
      SMART_INSTANCE_APPEARANCE: '{"colors":{"seed":"#6e4c7e","variant":"tonalSpot","colorMatch":false,"coreOverrides":{}},"shape":"weich","font":"roboto-flex"}'
  backup:
    environment:
      RESTIC_REPOSITORY: /stacktest-restic-repo
      RESTIC_PASSWORD: stack-test-only
    volumes:
      - restic-test:/stacktest-restic-repo
      # Replaces the bind mount of the stack directory: restic cannot read macOS bind mounts
      # (Docker Desktop file sharing returns EIO); the test copies the files into this volume.
      - stack-config-test:/stack-config:ro

volumes:
  restic-test:
    name: smart-stacktest-restic
  stack-config-test:
    name: smart-stacktest-config
