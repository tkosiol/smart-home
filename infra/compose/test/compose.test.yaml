services:
  web:
    ports:
      - '127.0.0.1:18080:8080'
    environment:
      # Must match STACK_TEST_INSTANCE in tests/e2e/specs/stack-smoke.spec.ts.
      SMART_INSTANCE_APPEARANCE: '{"colors":{"seed":"#6e4c7e","variant":"tonalSpot","colorMatch":false,"coreOverrides":{}},"shape":"weich","font":"roboto-flex"}'
  api:
    environment:
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Smart Home <noreply@example.org>
    volumes:
      # Same targets as in compose.yaml, so these replace the ./certs/* bind mounts (the test keeps its
      # throwaway certificates in volumes instead of the repository). The api gets the public files only.
      - certs-public-test:/smart/certs:ro
    depends_on:
      mailpit:
        condition: service_healthy
  broker:
    volumes:
      - certs-public-test:/mosquitto/certs:ro
      - certs-private-test:/mosquitto/certs-private:ro
  # Test gateway: the Raspberry Pi's Mosquitto, bridged to the stack broker over mTLS with the
  # gateway certificate. stack-test.sh renders pi.mosquitto.conf and the certificates into pi-test.
  pi:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: 'no'
    command: ['mosquitto', '-c', '/mosquitto/pi/mosquitto.conf']
    volumes:
      - pi-test:/mosquitto/pi:ro
    depends_on:
      broker:
        condition: service_healthy
    networks: [internal]
  # Catches the sign-in mails; the end-to-end tests read the codes through its API (tests/e2e/helpers).
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:18025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  backup:
    environment:
      RESTIC_REPOSITORY: /stacktest-restic-repo
      RESTIC_PASSWORD: stack-test-only
    volumes:
      - restic-test:/stacktest-restic-repo
      # Replaces the bind mount of the stack directory: restic cannot read macOS bind mounts
      # (Docker Desktop file sharing returns EIO); the test copies the files into this volume.
      - stack-config-test:/stack-config:ro

# All created (and removed) by stack-test.sh before compose runs; external keeps compose from warning about it.
volumes:
  certs-public-test:
    name: smart-stacktest-certs-public
    external: true
  certs-private-test:
    name: smart-stacktest-certs-private
    external: true
  pi-test:
    name: smart-stacktest-pi
    external: true
  restic-test:
    name: smart-stacktest-restic
    external: true
  stack-config-test:
    name: smart-stacktest-config
    external: true
