# Test fixture: the gateway Mosquitto of the Raspberry Pi as the stack test runs it (ADR-0020, spike 2b).
# stack-test.sh replaces @GATEWAY_ID@ and copies this file with the gateway certificate into the pi volume.
# The real configuration lives under gateway/ (stage 5b); only the local listener differs here: it is bound to
# the container's loopback without a password, because the test publishes through `docker compose exec`.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
queue_qos0_messages true
# The 24 h limits recommended by ADR-0020 (72 h would be 75000 messages / 72 MiB).
max_queued_messages 25000
max_queued_bytes 25165824
# No per_listener_settings: on 2.0.x it switches queue_qos0_messages off.
log_dest stdout

listener 1883 127.0.0.1
allow_anonymous true

connection @GATEWAY_ID@-bridge
address broker:8883
bridge_cafile /mosquitto/pi/ca.crt
bridge_certfile /mosquitto/pi/@GATEWAY_ID@.crt
bridge_keyfile /mosquitto/pi/@GATEWAY_ID@.key
bridge_tls_version tlsv1.2
bridge_protocol_version mqttv311
cleansession false
local_clientid @GATEWAY_ID@-bridge-local
remote_clientid @GATEWAY_ID@-bridge
keepalive_interval 20
start_type automatic
restart_timeout 1 5
notifications true
notification_topic gw/@GATEWAY_ID@/bridge/connection
# Default, prevents loops: do not change.
try_private true
topic # out 1 zigbee2mqtt/ gw/@GATEWAY_ID@/z2m/
topic +/set in 0 zigbee2mqtt/ gw/@GATEWAY_ID@/z2m/
topic bridge/request/# in 0 zigbee2mqtt/ gw/@GATEWAY_ID@/z2m/
