# Global settings first: with per_listener_settings every listener below has its own authentication
# and ACL. entrypoint.sh copies this file to /mosquitto/run (a tmpfs in the stack) and appends tls.conf
# when MQTT_TLS=on.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
# Commands for an offline gateway must be dropped, never delivered late (ADR-0004, spike 2b).
queue_qos0_messages false
# Applies to every client (global setting): a gateway that was offline replays its buffered
# messages in one burst, and smart-api must be able to take them (default is 1000).
max_queued_messages 10000
log_dest stdout

# Internal listener for smart-api (and the simulator) inside the Docker network.
listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

# Gateways paired from the app (Home Assistant): websockets behind the web nginx (/mqtt), user name and
# key from the backend through the dynamic security plugin. Never published; the state lives in the tmpfs
# and the backend recreates it after every start (docs/superpowers/specs/2026-11-20-ha-kopplung-design.md).
listener 8080
protocol websockets
allow_anonymous false
max_connections 500
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/run/dynsec.json
