
# Public listener for gateways, appended by entrypoint.sh only when MQTT_TLS=on and all files exist.
# The client certificate's CN (gw-xxxxxxxx) is the user name; the ACL maps it to the gateway's prefix.
listener 8883
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/run/certs/ca.crt
certfile /mosquitto/run/certs/server.crt
keyfile /mosquitto/run/certs/server.key
crlfile /mosquitto/run/certs/crl.pem
tls_version tlsv1.2
max_connections 20
acl_file /mosquitto/run/acl
