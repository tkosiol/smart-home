# Tooling configuration only (ruff, pytest); the integration is not built as a package.
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
