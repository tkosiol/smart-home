# Test configuration for the Docker test (test/run-tests.sh, phase 2). The integration is not set up here: it has no
# YAML setup, the script writes its config entry into .storage (template next to this file).
http:
  server_port: 8123

# Demo entities with devices (lights among them), so there is something to publish.
demo:

# Connection lines of the integration (never payloads) show reconnects in the test.
logger:
  default: warning
  logs:
    custom_components.smart_bridge.connection: info
