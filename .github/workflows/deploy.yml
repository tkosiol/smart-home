name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: Full commit SHA on main whose images should run (rollback = older SHA)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.image }})
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, context: ., file: apps/backend/Dockerfile }
          - { image: web, context: ., file: apps/frontend/Dockerfile }
          - { image: broker, context: infra/broker, file: infra/broker/Dockerfile }
          - { image: backup, context: infra/backup, file: infra/backup/Dockerfile }
    env:
      IMAGE: ghcr.io/tkosiol/smart-home-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        run: docker push "$IMAGE"

  staging:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      sha: ${{ github.event.workflow_run.head_sha }}
      url: https://staging.smart.tillkosiol.de
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      sha: ${{ github.event.workflow_run.head_sha }}
      url: https://smart.tillkosiol.de
    secrets: inherit

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
      url: ${{ inputs.environment == 'production' && 'https://smart.tillkosiol.de' || 'https://staging.smart.tillkosiol.de' }}
    secrets: inherit
