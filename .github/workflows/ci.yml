name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  verify:
    name: verify
    runs-on: ubuntu-24.04
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm licenses:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tz
      - run: pnpm build

  infra-local:
    name: infra-local
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f infra/local/compose.yaml up -d --wait
      - run: sh infra/local/smoke-test.sh
      - if: always()
        run: docker compose -f infra/local/compose.yaml down -v

  stack:
    name: stack
    runs-on: ubuntu-24.04
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/e2e exec playwright install --with-deps chromium
      - run: sh infra/compose/test/stack-test.sh

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/frontend exec playwright install --with-deps chromium
      - run: pnpm --filter @smart/frontend build-storybook
      - run: pnpm --filter @smart/frontend test-storybook:ci

  ops:
    name: ops
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          infra/deploy/smart-deploy infra/deploy/deploy.sh infra/deploy/provision.sh infra/deploy/admin.sh
          infra/deploy/broker-certs.sh infra/deploy/provision-gateway.sh infra/pki/pki.sh infra/pki/test/run-tests.sh
          infra/deploy/test/run-tests.sh infra/deploy/test/stubs/docker infra/deploy/test/stubs/curl infra/deploy/test/stubs/ssh infra/deploy/test/stubs/sudo
          infra/backup/backup.sh infra/backup/restore-test.sh infra/broker/entrypoint.sh
          infra/local/smoke-test.sh infra/compose/test/stack-test.sh infra/broker/test/broker-test.sh
          gateway/render.sh gateway/mosquitto-entrypoint.sh gateway/test/gateway-test.sh
          gateway/deploy.sh gateway/test/deploy-tests.sh gateway/test/stubs/docker gateway/test/stubs/rsync
          gateway/test/stubs/timeout gateway/test/stubs/chown gateway/test/stubs/systemctl gateway/test/stubs/curl
          gateway/backup/lib.sh gateway/backup/backup.sh gateway/backup/restore-test.sh gateway/backup/restic-job.sh
          gateway/test/backup-tests.sh
      - name: deploy script tests
        run: bash infra/deploy/test/run-tests.sh
      - name: pki script tests
        run: bash infra/pki/test/run-tests.sh
      - name: broker tests
        run: bash infra/broker/test/broker-test.sh
      - name: gateway tests
        run: bash gateway/test/gateway-test.sh
      - name: gateway deploy tests
        run: bash gateway/test/deploy-tests.sh
      - name: gateway backup tests
        run: bash gateway/test/backup-tests.sh
