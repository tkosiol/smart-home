<mat-form-field appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    uiErrorStateSync
    [type]="type()"
    [value]="value()"
    [required]="required()"
    [disabled]="disabled()"
    [errorStateMatcher]="errorMatcher"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.name]="name() ?? null"
    (input)="onInput($event)"
  />
  @if (error(); as error) {
    <mat-error>{{ error }}</mat-error>
  } @else if (hint(); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
</mat-form-field>
