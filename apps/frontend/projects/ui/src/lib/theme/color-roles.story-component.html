@for (group of groups; track group.title) {
  <section>
    <h2>{{ group.title }}</h2>
    <ul class="grid">
      @for (swatch of group.swatches; track $index) {
        <li class="swatch">
          <div class="fill" [style.background]="swatch.fill" [style.color]="swatch.on?.color">
            @if (swatch.on; as on) {
              <span class="on">{{ on.name }}</span>
            }
          </div>
          <span class="name">{{ swatch.name }}</span>
        </li>
      }
    </ul>
  </section>
}
