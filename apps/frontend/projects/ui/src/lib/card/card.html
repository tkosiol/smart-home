<mat-card [appearance]="appearance()">
  @if (heading(); as heading) {
    <mat-card-header>
      @if (level() === 2) {
        <h2 mat-card-title class="title">{{ heading }}</h2>
      } @else {
        <h3 mat-card-title class="title">{{ heading }}</h3>
      }
      @if (description(); as description) {
        <p mat-card-subtitle class="subtitle">{{ description }}</p>
      }
      <ng-content select="[uiCardHeaderAction]" />
    </mat-card-header>
  }
  <mat-card-content>
    <ng-content />
  </mat-card-content>
  @if (actions()) {
    <mat-card-actions align="end">
      <ng-content select="[uiCardActions]" />
    </mat-card-actions>
  }
</mat-card>
