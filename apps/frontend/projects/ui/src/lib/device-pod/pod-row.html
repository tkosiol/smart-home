<div #scroller class="scroller" (focusin)="bringIntoView($event)" (scroll)="measure()">
  <ng-content />
</div>
@if (arrows()) {
  <div class="arrows">
    <ui-icon-button
      variant="tonal"
      icon="chevron_left"
      [label]="'ui.podRow.previous' | transloco"
      [disabled]="atStart()"
      (pressed)="page(-1)"
    />
    <ui-icon-button
      variant="tonal"
      icon="chevron_right"
      [label]="'ui.podRow.next' | transloco"
      [disabled]="atEnd()"
      (pressed)="page(1)"
    />
  </div>
}
