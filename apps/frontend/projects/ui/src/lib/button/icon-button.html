@if (route(); as route) {
  <a class="ui-icon-button" [routerLink]="route" [attr.aria-label]="label()">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    class="ui-icon-button"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    (click)="pressed.emit()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  <span class="content">
    <ng-content><ui-icon [name]="icon()" /></ng-content>
  </span>
</ng-template>
