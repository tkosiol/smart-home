@if (route(); as route) {
  <a class="ui-button" [routerLink]="route">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button class="ui-button" [type]="type()" [disabled]="disabled()" (click)="pressed.emit()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  <span class="content">
    @if (icon(); as icon) {
      <ui-icon [name]="icon" size="sm" />
    }
    <ng-content />
  </span>
</ng-template>
