@if (route(); as route) {
  <a [matButton]="variant()" [routerLink]="route">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button [matButton]="variant()" [type]="type()" [disabled]="disabled()" (click)="pressed.emit()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  @if (icon(); as icon) {
    <ui-icon matButtonIcon [name]="icon" size="sm" />
  }
  <ng-content />
</ng-template>
