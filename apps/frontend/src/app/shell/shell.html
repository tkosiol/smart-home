<ui-adaptive-shell [destinations]="destinations()" [navigationLabel]="'app.nav.label' | transloco">
  <header uiShellTopBar>
    <ui-top-app-bar [heading]="householdName()">
      @if (canSwitchHousehold()) {
        <ui-icon-button
          uiTopAppBarActions
          route="/haushalte"
          icon="swap_horiz"
          [label]="'app.household.switch' | transloco"
        />
      }
      <ui-icon-button
        uiTopAppBarActions
        route="/mehr"
        icon="notifications"
        [label]="'app.notifications.none' | transloco"
      >
        <ui-badge [count]="0"><ui-icon name="notifications" /></ui-badge>
      </ui-icon-button>
    </ui-top-app-bar>
  </header>
  @if (offline()) {
    <ui-banner uiShellBanner tone="offline">{{ 'app.offline' | transloco }}</ui-banner>
  }
  @if (updateReady()) {
    <ui-banner uiShellBanner tone="info">
      {{ 'app.update.text' | transloco }}
      <div uiBannerActions>
        <ui-button variant="text" (pressed)="reload()">{{
          'app.update.reload' | transloco
        }}</ui-button>
      </div>
    </ui-banner>
  }
  <router-outlet />
</ui-adaptive-shell>
