    <ui-top-app-bar [heading]="'app.household.placeholder' | transloco">
      <ui-icon-button
        uiTopAppBarActions
        route="/mehr"
        icon="notifications"

    </ui-top-app-bar>
  </header>
  <router-outlet />
</ui-adaptive-shell>
