server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Docker's embedded DNS; resolving lazily lets nginx start before the api container.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    # Distinctive alias from compose.yaml; never the generic name "api" (shared proxy network).
    set $api_upstream http://smart-api-upstream:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 1h;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Fixed file name (not content-hashed): must be revalidated so edits reach returning browsers.
  location = /theme-boot.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ~* \.(?:js|css|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'CSP_NONCE' $request_id;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
