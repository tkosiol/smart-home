packages:
  - apps/*
  - packages/*
  - tools/*
  - tests/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  cpu-features: false
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

engineStrict: true

overrides:
  jest-runtime: 30.4.2
