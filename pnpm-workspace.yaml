packages:
  - apps/*
  - packages/*
  - tools/*
  - tests/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  cpu-features: false
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

engineStrict: true

# Stop-gap for @storybook/test-runner 0.26.0 (jest ^30): Storybook 10 loads .storybook/test-runner.ts
# through module.register(), which jest-runtime 30.5.x rejects ("module.register() is not supported
# in Jest"), so test-storybook cannot start. 30.4.2 predates that guard.
# Remove once @storybook/test-runner is replaced (the test-runner is end-of-life in Storybook 10).
overrides:
  jest-runtime: 30.4.2
  # CVE-2023-54404 (unbounded array validation, fixed in 4.6.6): Angular CLI, @angular/forms and
  # the MCP SDK pin 4.6.5 transitively. Remove once they depend on 4.6.6 or later.
  zod: 4.6.6
  # CVE-2026-113872 (DoS via aborted upload, fixed in 2.5.0): @nestjs/platform-express pins 2.4.0
  # up to 12.2.0. Remove once it depends on 2.5.0 or later.
  multer: 2.5.0
